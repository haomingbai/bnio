name: Package and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            liburing-dev \
            libssl-dev \
            ninja-build \
            pkg-config

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_SHARED_LIBS=ON
          -DBNIO_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -LE stress

      - name: Run stress tests repeatedly
        run: >-
          ctest --test-dir build --output-on-failure
          -L stress --repeat until-fail:20

  package:
    name: Package (deb + rpm via CPack)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake \
            libssl-dev \
            liburing-dev \
            ninja-build \
            pkg-config \
            rpm

      - name: Build and install bexec
        run: |
          git clone --depth 1 https://github.com/haomingbai/bexec.git
          cmake -S bexec -B bexec/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBEXEC_BUILD_TESTS=OFF \
            -DBEXEC_BUILD_EXAMPLES=OFF
          cmake --build bexec/build
          sudo cmake --install bexec/build

      - name: Configure
        run: >-
          cmake -S . -B package-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr
          -DCMAKE_INSTALL_LIBDIR=lib
          -DBUILD_SHARED_LIBS=ON
          -DBNIO_BUILD_TESTS=OFF
          -DBNIO_BUILD_EXAMPLES=OFF
          -DBNIO_PACKAGE=ON
          -DBNIO_BEXEC_PROVIDER=FIND_PACKAGE

      - name: Build
        run: cmake --build package-build

      - name: Generate DEB packages
        working-directory: package-build
        run: cpack -G DEB

      - name: Generate RPM packages
        working-directory: package-build
        run: cpack -G RPM

      - name: Collect packages
        run: |
          mkdir -p artifacts
          cp package-build/*.deb artifacts/ 2>/dev/null || true
          cp package-build/*.rpm artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packages
          path: artifacts/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: packages
          path: packages/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
