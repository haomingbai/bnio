name: Package and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            liburing-dev \
            libssl-dev \
            ninja-build \
            pkg-config

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_SHARED_LIBS=ON
          -DBNIO_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -LE stress

      - name: Run stress tests repeatedly
        run: >-
          ctest --test-dir build --output-on-failure
          -L stress --repeat until-fail:20

  package:
    name: Package (deb + signed rpm via CPack)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Verify tag matches BNIO_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cmake_version="$(sed -n 's/^set(BNIO_VERSION "\([^"]*\)".*/\1/p' CMakeLists.txt | head -n 1)"
          if [[ -z "$cmake_version" ]]; then
            echo "::error::could not read BNIO_VERSION from CMakeLists.txt"
            exit 1
          fi
          if [[ "$tag_version" != "$cmake_version" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match BNIO_VERSION=${cmake_version}"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches BNIO_VERSION=${cmake_version}"

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake \
            gnupg \
            libssl-dev \
            liburing-dev \
            ninja-build \
            pkg-config \
            rpm

      - name: Build and install bexec
        run: |
          git clone --depth 1 --branch v0.1.1 https://github.com/haomingbai/bexec.git
          cmake -S bexec -B bexec/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBEXEC_BUILD_TESTS=OFF \
            -DBEXEC_BUILD_EXAMPLES=OFF
          cmake --build bexec/build
          sudo cmake --install bexec/build

      - name: Configure
        run: >-
          cmake -S . -B package-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr
          -DCMAKE_INSTALL_LIBDIR=lib
          -DBUILD_SHARED_LIBS=ON
          -DBNIO_BUILD_TESTS=OFF
          -DBNIO_BUILD_EXAMPLES=OFF
          -DBNIO_PACKAGE=ON
          -DBNIO_BEXEC_PROVIDER=FIND_PACKAGE

      - name: Build
        run: cmake --build package-build

      # DEB packages are intentionally unsigned: apt does not verify
      # per-package signatures, and this workflow publishes release files
      # rather than an apt repository. See docs/release-signing.md.
      - name: Generate DEB packages
        working-directory: package-build
        run: cpack -G DEB

      - name: Generate RPM packages
        working-directory: package-build
        run: cpack -G RPM

      - name: Collect packages
        run: |
          mkdir -p artifacts
          cp package-build/*.deb artifacts/ 2>/dev/null || true
          cp package-build/*.rpm artifacts/ 2>/dev/null || true
          sha256sum artifacts/*.deb > artifacts/SHA256SUMS.deb
          ls -la artifacts/

      - name: Sign RPM packages
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
          RPM_GPG_PASSPHRASE: ${{ secrets.RPM_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [[ -z "${RPM_GPG_PRIVATE_KEY:-}" ]]; then
            echo "::error::RPM_GPG_PRIVATE_KEY is not configured; refusing to publish unsigned RPMs"
            exit 1
          fi

          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf 'allow-preset-passphrase\n' > "$GNUPGHOME/gpg-agent.conf"
          gpgconf --kill gpg-agent 2>/dev/null || true
          trap 'gpgconf --kill gpg-agent 2>/dev/null || true; rm -rf "$GNUPGHOME"' EXIT

          printf '%s' "$RPM_GPG_PRIVATE_KEY" | gpg --batch --import

          key_id="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
          if [[ -z "$key_id" ]]; then
            echo "::error::no secret key found after import"
            exit 1
          fi
          fingerprint="$(gpg --batch --with-colons --fingerprint "$key_id" | awk -F: '/^fpr:/ {print $10; exit}')"

          if [[ -n "${RPM_GPG_PASSPHRASE:-}" ]]; then
            preset_cmd="$(command -v gpg-preset-passphrase || echo /usr/lib/gnupg/gpg-preset-passphrase)"
            if [[ ! -x "$preset_cmd" ]]; then
              echo "::error::gpg-preset-passphrase not found; cannot unlock the signing key"
              exit 1
            fi
            gpgconf --launch gpg-agent
            while IFS= read -r keygrip; do
              printf '%s' "$RPM_GPG_PASSPHRASE" | "$preset_cmd" --preset "$keygrip"
            done < <(gpg --batch --with-colons --with-keygrip --list-secret-keys | awk -F: '/^grp:/ {print $10}')
          fi

          rpmsign --addsign \
            --define "_gpg_name $key_id" \
            --define "__gpg /usr/bin/gpg" \
            --define "_gpg_digest_algo sha256" \
            artifacts/*.rpm

          gpg --armor --export "$key_id" > artifacts/bnio-rpm-signing-key.asc
          version="${GITHUB_REF_NAME#v}"
          {
            echo "bnio RPM signing key"
            echo
            echo "Fingerprint: $fingerprint"
            echo
            echo "Verify:"
            echo "  rpm --import bnio-rpm-signing-key.asc"
            echo "  rpmkeys --checksig bnio-${version}-Linux-runtime.rpm"
          } > artifacts/RPM-SIGNING.txt

          sudo rpm --import artifacts/bnio-rpm-signing-key.asc
          rpmkeys --checksig artifacts/*.rpm

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packages
          path: artifacts/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: packages
          path: packages/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
