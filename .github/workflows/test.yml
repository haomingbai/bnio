name: Cross-platform tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and stress test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: macos-latest
            cc: clang
            cxx: clang++

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            liburing-dev \
            libssl-dev \
            ninja-build \
            pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja openssl@3 pkg-config
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Install coverage tool
        run: python -m pip install gcovr==8.6

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUPP_BUILD_EXAMPLES=OFF
          -DBUPP_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -LE stress

      - name: Run stress tests repeatedly
        run: >-
          ctest --test-dir build --output-on-failure
          -L stress --repeat until-fail:20

      - name: Generate Linux coverage report
        if: runner.os == 'Linux'
        run: |
          cmake -E make_directory coverage
          gcovr --config gcovr.cfg --gcov-executable gcov build

      - name: Generate macOS coverage report
        if: runner.os == 'macOS'
        run: |
          cmake -E make_directory coverage
          gcovr --config gcovr.cfg \
            --gcov-executable "xcrun llvm-cov gcov" build

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ runner.os }}
          path: coverage/
          if-no-files-found: error
