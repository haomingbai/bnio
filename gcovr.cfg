root = .
filter = include/
filter = src/

gcov-exclude = build-*
gcov-exclude = _deps
exclude = build-*
exclude = _deps

gcov-ignore-parse-errors = negative_hits.warn_once_per_file
print-summary = yes
txt = coverage/summary.txt
html-details = coverage/index.html
cobertura = coverage/coverage.xml
cobertura-pretty = yes
